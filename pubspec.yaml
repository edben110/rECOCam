name: recocam
description: "rECOCam - Aplicación de clasificación de residuos reciclables con IA local"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.0
  image_picker: ^1.1.2
  tflite_flutter: ^0.12.1
  provider: ^6.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  permission_handler: ^11.4.0
  equatable: ^2.0.7
  collection: ^1.19.1
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.5.0
  shared_preferences: ^2.3.4
  image: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/labels/
    - assets/images/
    - assets/json/
